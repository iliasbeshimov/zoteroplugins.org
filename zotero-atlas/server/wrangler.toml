name = "zotero-atlas-api"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "zoteroatlas.com/api/*", zone_name = "zoteroatlas.com" },
  # Only the library box's data (/api/v1/box.json); everything else there answers 404.
  { pattern = "zoteroplugins.org/api/v1/*", zone_name = "zoteroplugins.org" },
]

[[d1_databases]]
binding = "DB"
database_name = "zotero-atlas"
database_id = "27da323c-b438-4551-bf66-df5a505890db"

[triggers]
# Nightly clean-up; every 10 minutes, one watched library guide.
crons = ["17 3 * * *", "*/10 * * * *"]

# Website reviews' confirmation mail (the key is the secret MAIL_API_KEY).
[vars]
MAIL_PROVIDER = "resend"
MAIL_FROM = "zoteroplugins.org <reviews@zoteroplugins.org>"
