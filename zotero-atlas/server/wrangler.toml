name = "zotero-atlas-api"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "zoteroatlas.com/api/*", zone_name = "zoteroatlas.com" }]

[[d1_databases]]
binding = "DB"
database_name = "zotero-atlas"
database_id = "fill in after: wrangler d1 create zotero-atlas"

[triggers]
crons = ["17 3 * * *"]
