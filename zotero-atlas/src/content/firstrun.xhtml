<?xml version="1.0"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Zotero Atlas</title>
  <link rel="stylesheet" href="chrome://zotero-atlas/content/firstrun.css?v=1.5.0"/>
  <script src="chrome://zotero/content/include.js"></script>
  <script src="chrome://zotero-atlas/content/firstrun.js"></script>
</head>
<body>
  <header>
    <img src="chrome://zotero-atlas/content/icons/atlas.svg" width="38" height="38" alt=""/>
    <div>
      <h1>Zotero Atlas</h1>
      <p class="d">One setting. You can change it any time in Zotero Atlas, under About.</p>
    </div>
  </header>

  <section>
    <h2>Plugin updates</h2>
    <label class="opt" id="hold-opt">
      <input type="checkbox" id="hold" checked="checked"/>
      <span>
        <span class="t">Hold plugin updates until they're checked <span class="rec">Recommended</span></span>
        <span class="d">Zotero installs plugin updates by itself without looking at what changed. With this on, an update we've checked that isn't graded lower installs as usual, usually within a day. Anything else waits for you in Zotero Atlas. Plugins zoteroplugins.org doesn't list are never held.</span>
      </span>
    </label>
  </section>

  <footer>
    <span class="d">Find Zotero Atlas in Tools → Zotero Atlas, or with its button by the sync button.</span>
    <button type="button" class="primary" id="done">Done</button>
  </footer>
</body>
</html>
