<?xml version="1.0"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" windowtype="zotero-atlas"
  persist="screenX screenY width height sizemode">
<head>
  <meta charset="utf-8"/>
  <title>Zotero Atlas</title>
  <link rel="stylesheet" href="chrome://zotero-atlas/content/atlas.css"/>
  <script src="chrome://zotero/content/include.js"></script>
  <script src="chrome://zotero-atlas/content/atlas.js"></script>
</head>
<body>
  <header>
    <img class="logo" src="chrome://zotero-atlas/content/icons/atlas.svg" width="22" height="22" alt=""/>
    <nav class="tabs">
      <button id="tab-find" class="tab on" type="button">Find plugins</button>
      <button id="tab-mine" class="tab" type="button">Your plugins <span id="mine-count" class="count"/></button>
    </nav>
    <div class="status">
      <span id="status"/>
      <button id="refresh" type="button" title="Fetch the catalogue again">Refresh</button>
    </div>
  </header>
  <section id="find">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search plugins"/>
      <select id="job"><option value="">All jobs</option></select>
      <select id="sort">
        <option value="downloads">Most downloaded</option>
        <option value="name">Name</option>
        <option value="updated">Recently updated</option>
        <option value="grade">Best grade</option>
      </select>
      <label class="fit"><input id="fit" type="checkbox" checked="checked"/> <span id="fit-label">Works with your Zotero</span></label>
    </div>
    <div id="list" class="list"/>
    <div class="more-row"><button id="more" type="button" hidden="hidden">Show more</button></div>
    <footer><span id="foot"/></footer>
  </section>
  <section id="mine" hidden="hidden">
    <div class="page">
      <p class="lead" id="mine-lead"/>
      <div id="offer"/>
      <div id="needs"/>
      <div id="updates"/>
      <div id="all"/>
      <div id="gone"/>
      <p class="fineprint" id="mine-foot"/>
    </div>
  </section>
</body>
</html>
