# Host classification for static analysis.
#
# Each entry is an exact host or "*.suffix" (any subdomain of suffix, and suffix itself).
# The first matching entry wins, so list specific hosts before broad wildcards.
# Bump `version` on every change: analyses record it, so a table change never looks like a
# plugin change.
#
# flags: legal-risk | china-only | blocked-in-mainland-china | public-relay | account-oauth
# A developer-server entry is a factual claim about who runs a host; add one only with a source.

