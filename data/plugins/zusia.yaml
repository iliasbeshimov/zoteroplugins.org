    version: "1.7.0 (the same holds for 1.8.0)"
    text: |-
      Two corrections. Zusia needs no API key: it uses the assistant you already have, your Claude Code, Codex or Antigravity subscription or any ACP agent, and an API key or a local model (Ollama, Unsloth, OpenAI-compatible) is optional. And since 1.1.0 the assistant reads the paper's full text by default, not only the metadata, opening only the pages it needs.

      It answers with rendered LaTeX, numbered theorem boxes with linked references, drawings, and it reads images such as the current PDF page. It launches the assistant's own program on your computer, which is why it starts local processes; there is no Zusia server.
