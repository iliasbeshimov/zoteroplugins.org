      You published 0.5.0 as a full release on 4 November, and the card now describes it: it works with Zotero 9 and 10, and every check of its code came out low. Thanks for moving it over.

      Your case also showed a gap on our side: a plugin whose own update address serves a newer version than its latest full release. We're deciding how cards should handle that for every plugin at once.
