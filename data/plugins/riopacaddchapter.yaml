schemaVersion: 1
slug: riopacaddchapter
repo: theratramnus/riopacaddchapter
status: listed
retired:
  date: "2026-11-01"
  reason: |-
    It no longer works: the RI OPAC can't be reached from headless browsers any more.
  url: https://github.com/iliasbeshimov/zoteroplugins.org/issues/5
  alternative:
    name: "RIOPAC Add Chapter for Chrome (a browser extension)"
    url: https://github.com/theRatramnus/riopac-add-chapter-chrome
responses:
  - date: "2026-10-28"
    from: theRatramnus
    about: capabilities
    text: |-
      I wasn't aware of the zotero://plugin-schema, I just used the Zotero Plugin Template (https://github.com/windingwind/zotero-plugin-template), which enables this behavior for hot reloading, I think.
    url: https://github.com/iliasbeshimov/zoteroplugins.org/issues/4
    status: finding-stands
    reply: |-
      You're right that it comes from the template, and the card credits both links to zotero-plugin-toolkit, not to your own code. They aren't only for development, though: toolkit 5.x registers both zotero:// handlers whenever the plugin starts, in release builds too, so the finding holds for the released file. Toolkit 6.0.0 fixes it: zotero://plugin is gone, and the debug link is registered only if a plugin asks for it. Since you've retired the plugin, there's nothing to rebuild.
    repliedAt: "2026-11-03"
  - date: "2026-11-01"
    from: theRatramnus
    about: other
    text: |-
      This plugin does not work anymore. This is because you can't access the RI Opac using headless browsers. Please use https://github.com/theRatramnus/riopac-add-chapter-chrome instead.
    url: https://github.com/iliasbeshimov/zoteroplugins.org/issues/5
    status: noted
    reply: |-
      Thanks for letting us know. The plugin is now marked as retired by its developer: it's out of our lists, this page says why and points to the Chrome extension, and we no longer offer it for install.
    repliedAt: "2026-11-03"
