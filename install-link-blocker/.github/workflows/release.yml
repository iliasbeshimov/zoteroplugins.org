# Builds the plugin file from the tagged commit and publishes it with GitHub's build attestation:
# a signed statement that this workflow built these files from that commit. See the README for
# how to check a downloaded file.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # create the release
  id-token: write # sign the attestation
  attestations: write
jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash # stops on any failed command, including inside a pipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is a plain version matching manifest.json, and the addresses are this repo's
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME}" = "v$(jq -r .version src/manifest.json)"
          test "$(jq -r .homepage_url src/manifest.json)" = "https://github.com/${GITHUB_REPOSITORY}"
      - name: Build
        run: python3 build.py | tee build.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.xpi
            dist/updates.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built by this workflow from ${GITHUB_SHA}."
            echo
            echo '```'
            cat build.txt
            echo '```'
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.xpi dist/updates.json --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file notes.md
