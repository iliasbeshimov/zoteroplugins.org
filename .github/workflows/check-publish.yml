name: Publish the plugin check

# Rebuilds the plugin check (pipeline/check-action/) with this week's hosts table, library index and
# hand reviews, and moves the check-v<major> tag to it: an orphan commit holding only the built files,
# so `uses: iliasbeshimov/zoteroplugins.org@check-v1` downloads a few MB, not the repository.
# Weekly, after Sunday's full census; by hand after a change to the check or its rules.
on:
  schedule:
    - cron: "23 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test the check
        run: pnpm exec vitest run pipeline/test/check.test.ts

      - name: Build and tag
        env:
          GIT_AUTHOR_NAME: Ilias Beshimov
          GIT_AUTHOR_EMAIL: 2678455+iliasbeshimov@users.noreply.github.com
        run: scripts/publish-check.sh

      - name: Push the tag
        run: |
          tag="check-v$(node -p "require('./pipeline/check-action/package.json').version.split('.')[0]")"
          git push --force origin "refs/tags/$tag"
          echo "Published $tag -> $(git rev-parse "$tag")" >> "$GITHUB_STEP_SUMMARY"
