name: Zotero Atlas on Windows

# Opens Zotero Atlas's windows in a real Zotero on a Windows desktop (sandbox/windows/): each
# window's title bar, close button included, must be on screen at 1280x720 (a 1080p laptop at
# 150%), Escape and Ctrl+W must close the Atlas window, and its dropdown lists must have a
# background. The released .xpi runs too, to show the check catches what users reported.
on:
  push:
    paths: ["zotero-atlas/src/**", "sandbox/windows/**", ".github/workflows/atlas-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.os }}, Zotero ${{ matrix.zotero }}, ${{ matrix.xpi }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x64, zotero: "10.0.8", xpi: this-commit }
          - { os: windows-2025, arch: x64, zotero: "10.0.8", xpi: released }
          - { os: windows-11-arm, arch: arm64, zotero: "10.0.8", xpi: this-commit }
          - { os: windows-11-arm, arch: arm64, zotero: "10.0.8", xpi: released }
          - { os: windows-2025, arch: x64, zotero: "7.0.32", xpi: this-commit }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: matrix.xpi == 'this-commit'
        with:
          python-version: "3.13"

      - name: Zotero
        shell: pwsh
        run: |
          $zip = "Zotero-${{ matrix.zotero }}_win-${{ matrix.arch }}.zip"
          curl.exe -sSfL -A "zoteroplugins.org atlas (+https://zoteroplugins.org)" -o "$env:RUNNER_TEMP\$zip" "https://download.zotero.org/client/release/${{ matrix.zotero }}/$zip"
          Expand-Archive "$env:RUNNER_TEMP\$zip" "$env:RUNNER_TEMP\zotero"
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\zotero" -Recurse -Filter zotero.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "no zotero.exe in $zip" }
          "ZOTERO_EXE=$exe" >> $env:GITHUB_ENV

      - name: Zotero Atlas
        shell: pwsh
        run: |
          if ('${{ matrix.xpi }}' -eq 'released') {
            $xpi = (Get-ChildItem zotero-atlas/site -Filter 'zotero-atlas-*.xpi' | Select-Object -First 1).FullName
          } else {
            python zotero-atlas/build.py
            $v = (Get-Content zotero-atlas/src/manifest.json -Raw | ConvertFrom-Json).version
            $xpi = (Resolve-Path "zotero-atlas/dist/zotero-atlas-$v.xpi").Path
          }
          "ATLAS_XPI=$xpi" >> $env:GITHUB_ENV

      - name: Check the windows
        shell: pwsh
        run: |
          $must = '${{ matrix.xpi }}' -eq 'this-commit'
          ./sandbox/windows/run.ps1 -Zotero $env:ZOTERO_EXE -Xpi $env:ATLAS_XPI -Out "$env:RUNNER_TEMP\out" -MustPass:$must

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: atlas-windows-${{ matrix.os }}-${{ matrix.zotero }}-${{ matrix.xpi }}
          path: |
            ${{ runner.temp }}/out/shots
            ${{ runner.temp }}/out/summary.json
            ${{ runner.temp }}/out/io
