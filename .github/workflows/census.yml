name: Census

# Nightly: re-measure every known plugin (stars, downloads, contributors, releases, Zotero
# compatibility) and append one row per plugin to data/census/history/YYYY-MM.csv, then refresh
# every plugin's profile and scorecard (data/generated/). Only new release files are downloaded.
# Nightly runs also add plugins new on the curated lists (syt2's add-on market, zotero-chinese,
# ZotDex).
# Weekly (Sunday): full discovery across every source, GitHub search included.
on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "43 4 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh (known plugins) or full (discover new ones too)"
        type: choice
        options: [refresh, full]
        default: refresh

permissions:
  contents: write
  # The last step keeps one open issue while nightly steps fail.
  issues: write

# Shared with the submit workflow: both write data/census and data/generated.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    # The first profile run without a warm cache can wait on the built-in token's hourly limit.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ETags, GraphQL responses and parsed manifests: keeps reruns cheap and within rate limits.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/http
            .cache/manifests
          key: census-${{ github.run_id }}
          restore-keys: census-

      - name: Pick mode
        id: mode
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            if [ "${{ github.event.schedule }}" = "43 4 * * 0" ]; then mode=full; else mode=refresh; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run census
        id: census
        env:
          # A fine-grained PAT with public read-only access gets 5,000 requests/hour and code
          # search; the built-in token works for refresh runs but is limited to 1,000/hour.
          GITHUB_TOKEN: ${{ secrets.CENSUS_GITHUB_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.CENSUS_GITHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::CENSUS_GITHUB_TOKEN is not set; using the built-in token (slower, no code search)."
          fi
          pnpm atlas census --mode "${{ steps.mode.outputs.mode }}"
          pnpm atlas census-explorer

      # Code scan, scorecard, compatibility and languages for every listed plugin. A failure here
      # shouldn't lose the census snapshot, so the commit step runs regardless.
      # Submissions still in the queue (a waiting submit run can be cancelled by GitHub): decide them
      # now, so the profile step below grades the ones that are Zotero plugins.
      - name: Process submissions
        id: submissions
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.CENSUS_GITHUB_TOKEN || github.token }}
        run: pnpm atlas submit process --cap 20

      # Before profiling: the catalogue the profile run writes carries the ratings.
      - name: Fetch ratings
        id: ratings
        continue-on-error: true
        run: pnpm atlas ratings

      - name: Profile plugins
        id: profile
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.CENSUS_GITHUB_TOKEN || github.token }}
        run: pnpm atlas profile

      # Each plugin's own icon, from the release file just graded; only changed files are redone.
      - name: Plugin icons
        id: icons
        continue-on-error: true
        run: pnpm atlas icons

      - name: Commit snapshot
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/census data/generated data/slugs.json data/submissions site/public/icons
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Census and profiles (${{ steps.mode.outputs.mode }}) $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Publish the new grades the same night: a developer who ships a fix sees it on the site and
      # on their README badge the next day. HEAD is the main just pushed, rebased on anything newer.
      - name: Deploy
        id: deploy
        if: always() && steps.commit.outputs.changed == 'true'
        # Only this step gets the token; a step's own env isn't visible to its `if`, so it's checked here.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PUBLIC_REVIEWS_OPEN: ${{ vars.REVIEWS_OPEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set; not deploying."; exit 0; fi
          pnpm site:build
          cd site && npx -y wrangler@4 pages deploy dist --project-name zoteroplugins --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=false

      # A hand review covers one release's code. When a new release changes that code, its card goes
      # back to the scanner's verdict until someone reviews it again, and nothing else said so: keep
      # one open issue listing them, comment when a new one appears (that's what notifies), and close
      # it when none are left.
      - name: Lapsed reviews
        id: lapsed
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm atlas queue --out "$RUNNER_TEMP/queue"
          label=review-lapsed
          list=$(jq -r '.items[] | select(.kind == "review-lapsed") | "- [\(.name // .slug)](https://zoteroplugins.org/p/\(.slug)) \(.version): `\(.details.capability)`, reviewed in \(.details.reviewedVersion)"' "$RUNNER_TEMP/queue/queue.json")
          open=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$list" ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Every hand review covers the current release again."; fi
            exit 0
          fi
          body=$(printf 'A new release changed the code a hand review covered, so these cards show the scanner'"'"'s verdict until the finding is reviewed again (`data/reviews/<capability>/<slug>.json`):\n\n%s\n' "$list")
          if [ -z "$open" ]; then
            gh label create "$label" --color FBCA04 --description "A new release changed reviewed code" 2>/dev/null || true
            gh issue create --title "Hand reviews to redo" --label "$label" --body "$body"
            exit 0
          fi
          old=$(gh issue view "$open" --json body --jq .body)
          added=$(printf '%s\n' "$list" | grep -vxF -f <(printf '%s\n' "$old") || true)
          gh issue edit "$open" --body "$body"
          if [ -n "$added" ]; then gh issue comment "$open" --body "$(printf 'New since the last run:\n\n%s\n' "$added")"; fi

      # The steps above carry on when one fails, so the snapshot still gets committed, but then the
      # run looked green (the profile step failed unseen from 2026-11-13 to 11-16). A step allowed to
      # fail still records its outcome: fail the run if any did (GitHub emails the owner), and keep
      # one open issue listing them. The next run with no failed step closes it.
      - name: Report failed steps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOMES: |
            Run census=${{ steps.census.outcome }}
            Process submissions=${{ steps.submissions.outcome }}
            Fetch ratings=${{ steps.ratings.outcome }}
            Profile plugins=${{ steps.profile.outcome }}
            Plugin icons=${{ steps.icons.outcome }}
            Commit snapshot=${{ steps.commit.outcome }}
            Deploy=${{ steps.deploy.outcome }}
            Lapsed reviews=${{ steps.lapsed.outcome }}
        run: |
          label=nightly-failure
          failed=$(printf '%s\n' "$OUTCOMES" | awk -F= '$2 == "failure" { print "- " $1 }')
          open=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$failed" ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Every step passed: $RUN_URL"; fi
            exit 0
          fi
          body=$(printf 'Failed on %s:\n\n%s\n\nLogs: %s\n' "$(date -u +%F)" "$failed" "$RUN_URL")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create "$label" --color B60205 --description "A step of the nightly census failed" 2>/dev/null || true
            gh issue create --title "Nightly census: a step failed" --label "$label" --body "$body"
          fi
          echo "::error::Failed steps: $(printf '%s' "$failed" | tr '\n' ' ')"
          exit 1
