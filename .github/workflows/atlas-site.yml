name: zoteroatlas.com

# Deploys zotero-atlas/site/ (static, no build) to the Cloudflare Pages project "zoteroatlas"
# whenever it changes on main. Asset links are re-stamped first (stamp_site.py), so a page can't
# ship pointing at a stale ?v= hash.
on:
  push:
    branches: [main]
    paths: ["zotero-atlas/site/**", "zotero-atlas/stamp_site.py", "zotero-atlas/check_site_release.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip if main has moved on
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ] && [ "$GITHUB_EVENT_NAME" = "push" ] \
             && ! git diff --quiet "$GITHUB_SHA" origin/main -- zotero-atlas/site zotero-atlas/stamp_site.py; then
            echo "A newer commit changes the site; its own run deploys it."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Stamp asset links
        if: env.SKIP != '1'
        run: |
          python3 zotero-atlas/stamp_site.py
          if ! git diff --quiet -- zotero-atlas/site; then
            echo "::warning::Asset stamps were stale in the commit; deploying the re-stamped pages. Run zotero-atlas/stamp_site.py before committing."
          fi

      - name: Check the .xpi matches the latest release
        if: env.SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 zotero-atlas/check_site_release.py

      - name: Deploy to Cloudflare Pages
        if: env.SKIP != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set; not deploying."; exit 0; fi
          cd zotero-atlas/site
          npx -y wrangler@4 pages deploy . --project-name zoteroatlas --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false

      - name: Check the live site
        if: env.SKIP != '1'
        run: |
          sleep 10
          for p in / /install /trust /privacy /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://zoteroatlas.com$p")
            echo "$p $code"; [ "$code" = 200 ] || { echo "::error::$p returned $code"; exit 1; }
          done
