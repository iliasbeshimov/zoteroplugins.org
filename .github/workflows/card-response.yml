name: Card response

# A developer's response to their plugin's card (the "Respond to your plugin's card" issue form,
# labelled card-response). Within a minute or two of the issue being opened or edited:
# - `atlas response` checks that the author maintains the plugin's repository (owns it, published
#   one of its releases, or is a public member of the organisation that owns it);
# - if so, it adds the response to data/plugins/<slug>.yaml and the plugin's profile, marked
#   "We're checking", and this commits and deploys, so it shows on the plugin's page;
# - it leaves one note on the issue saying what happened (or that we'll check by hand, labelled
#   needs-check, or that it couldn't tell which plugin the issue is about).
# Each run goes through every open card-response issue, and closed ones whose author closed them
# before a run reached them (idempotent: one note per issue, a response changes only until we
# reply), so a run GitHub cancels while the census holds the group loses nothing. A run can wait
# hours behind the census, so "within a minute or two" holds only when the census isn't running. Our reply and the final status come
# from Ilias's comment that carries the reply mark (below), after the finding is re-checked.
# Nothing from an issue passes through this file: the script reads the issues through the API.
on:
  issues:
    types: [opened, edited, labeled]
  # Our reply: an owner comment carrying <!-- zoteroplugins:reply status=... --> (the reply flow in
  # the private outreach repository adds it when Ilias approves a draft) goes on the page too.
  issue_comment:
    types: [created, edited]
  # A safety net: anything a cancelled or dropped run missed.
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (contains(github.event.issue.labels.*.name, 'card-response') &&
       (github.event_name == 'issues' ||
        (github.event.comment.user.login == 'iliasbeshimov' &&
         contains(github.event.comment.body, 'zoteroplugins:reply'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared with the census and submissions: one writer of data/ at a time.
    concurrency:
      group: data
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      PUBLIC_REVIEWS_OPEN: ${{ vars.REVIEWS_OPEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Publish responses
        id: response
        run: pnpm atlas response

      - name: Commit
        id: commit
        if: steps.response.outputs.changed == 'true'
        run: '.github/scripts/commit-push.sh "Responses: developer responses from card-response issues" data/plugins data/generated'

      - name: Deploy
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          pnpm site:build
          cd site && npx -y wrangler@4 pages deploy dist --project-name zoteroplugins --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=false
